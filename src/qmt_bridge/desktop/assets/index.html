<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QMT Bridge</title>
  <style>
    :root {
      --bg: #0c0e12;
      --bg-elev: #14181f;
      --bg-input: #0f131a;
      --line: rgba(255,255,255,.08);
      --text: #eef2f7;
      --muted: #8b95a7;
      --accent: #4f8cff;
      --accent-dim: rgba(79,140,255,.16);
      --ok: #3dd68c;
      --warn: #f5c16c;
      --bad: #ff7a7a;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font: 13px/1.4 "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }
    body {
      background:
        radial-gradient(900px 320px at 90% -20%, rgba(79,140,255,.16), transparent 55%),
        radial-gradient(700px 280px at -5% 120%, rgba(61,214,140,.07), transparent 50%),
        var(--bg);
    }
    .wrap {
      height: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      flex: 0 0 auto;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 32px; height: 32px; border-radius: 10px;
      background: linear-gradient(160deg, #6aa2ff, #3b6fe0);
      display: grid; place-items: center;
      font-weight: 700; letter-spacing: .02em;
    }
    .brand h1 { font-size: 15px; margin: 0; font-weight: 650; }
    .brand p { margin: 0; color: var(--muted); font-size: 11px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: 999px;
      background: var(--bg-elev); border: 1px solid var(--line);
      color: var(--muted); font-size: 12px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #5c6574; }
    .pill.ok { color: var(--ok); }
    .pill.ok .dot { background: var(--ok); box-shadow: 0 0 0 4px rgba(61,214,140,.15); }
    .pill.warn { color: var(--warn); }
    .compact-meta {
      color: var(--muted); font-size: 12px;
      display: flex; gap: 14px;
    }
    .compact-meta b { color: var(--text); font-weight: 600; }
    body.editing .compact-meta { display: none; }

    .setup-banner {
      display: none; flex: 0 0 auto;
      padding: 8px 12px; border-radius: 10px;
      border: 1px solid rgba(245,193,108,.28);
      background: rgba(245,193,108,.08); color: var(--warn); font-size: 12px;
    }
    body.needs-setup .setup-banner { display: block; }

    .toolbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: minmax(220px, 1.2fr) auto;
      gap: 10px;
      align-items: center;
      background: linear-gradient(180deg, rgba(255,255,255,.03), transparent 40%), var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
    }
    .url {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 12px; color: var(--text);
      background: var(--bg-input); border: 1px solid var(--line);
      border-radius: 10px; padding: 8px 10px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      min-width: 0;
    }
    .url span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ghost {
      border: 0; background: transparent; color: var(--accent);
      cursor: pointer; font: inherit; padding: 0; white-space: nowrap;
    }
    .actions { display: flex; gap: 8px; }
    .btn {
      height: 34px; min-width: 78px; padding: 0 14px; border: 0; border-radius: 10px;
      font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn-primary { background: var(--accent); color: #081018; }
    .btn-primary.stop { background: #ff7a7a; color: #1a0808; }
    .btn-secondary {
      background: var(--accent-dim); color: #cfe0ff;
      border: 1px solid rgba(79,140,255,.25);
    }
    .btn-ghost {
      background: transparent; color: var(--muted);
      border: 1px solid var(--line);
    }
    .err {
      flex: 0 0 auto;
      color: var(--bad); font-size: 12px; min-height: 0;
      display: none;
    }
    .err.show { display: block; }

    #editPanel {
      display: none;
      flex: 1 1 auto;
      min-height: 0;
      grid-template-rows: 1fr auto;
      gap: 10px;
    }
    body.editing #editPanel { display: grid; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1.35fr 0.9fr;
      gap: 10px;
      min-height: 0;
    }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.03), transparent 40%), var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }
    h2 {
      margin: 0 0 2px; font-size: 11px; font-weight: 650;
      color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
    }
    label { display: block; margin: 0 0 4px; color: var(--muted); font-size: 11px; }
    .field { margin: 0; }
    .fields-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    input[type=text], input[type=password], input[type=number], select {
      width: 100%; height: 32px; border-radius: 9px;
      border: 1px solid var(--line); background: var(--bg-input); color: var(--text);
      padding: 0 10px; font: inherit; outline: none;
    }
    input:focus, select:focus { border-color: rgba(79,140,255,.7); }
    .path-row { display: flex; gap: 8px; }
    .path-row input { flex: 1; min-width: 0; }
    .path-row .btn { flex: 0 0 auto; min-width: 64px; height: 32px; padding: 0 10px; }
    .switch-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 4px 0;
    }
    .switch-row span { color: var(--text); }
    .hint { color: var(--muted); font-size: 11px; margin-top: 1px; }
    .toggle { position: relative; width: 40px; height: 22px; flex: 0 0 auto; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; border-radius: 999px;
      background: #2a3140; cursor: pointer; transition: .2s;
    }
    .slider:before {
      content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px;
      background: white; border-radius: 50%; transition: .2s;
    }
    .toggle input:checked + .slider { background: var(--accent); }
    .toggle input:checked + .slider:before { transform: translateX(18px); }

    .edit-foot {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: var(--bg-elev); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 8px 12px;
    }
    .meta {
      display: flex; gap: 18px;
      color: var(--muted); font-size: 12px;
    }
    .meta b { color: var(--text); font-weight: 600; margin-left: 4px; }

    .foot {
      flex: 0 0 auto;
      display: flex; justify-content: space-between; align-items: center;
      color: var(--muted); font-size: 11px; padding: 0 2px;
    }
    .toast {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
      background: #1b2230; color: var(--text); border: 1px solid var(--line);
      padding: 8px 12px; border-radius: 10px; font-size: 12px;
      opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">Q</div>
        <div>
          <h1>QMT Bridge</h1>
          <p>把 miniQMT 变成局域网 API</p>
        </div>
      </div>
      <div class="header-right">
        <div class="compact-meta" id="compactMeta">
          <span>miniQMT <b id="qmtMetaCompact">—</b></span>
          <span>xtquant <b id="xtMetaCompact">—</b></span>
        </div>
        <div id="status" class="pill"><i class="dot"></i>未启动</div>
      </div>
    </header>

    <div class="setup-banner" id="setupBanner">首次使用：请确认端口与交易相关配置后保存</div>

    <section class="toolbar">
      <div class="url">
        <span id="localUrl">http://127.0.0.1:8000</span>
        <button class="ghost" type="button" id="copyBtn">复制</button>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="toggleBtn" type="button">启动</button>
        <button class="btn btn-secondary" id="restartBtn" type="button">重启</button>
        <button class="btn btn-ghost" id="settingsBtn" type="button">设置</button>
        <button class="btn btn-ghost" id="docsBtn" type="button">打开文档</button>
      </div>
    </section>
    <div class="err" id="error"></div>

    <div id="editPanel">
      <div class="form-grid">
        <section class="card">
          <h2>连接</h2>
          <div class="fields-2">
            <div class="field">
              <label for="port">端口</label>
              <input id="port" type="number" min="1" max="65535" />
            </div>
            <div class="field">
              <label for="apiKey">API Key</label>
              <input id="apiKey" type="password" autocomplete="off" placeholder="可选" />
            </div>
          </div>
          <div class="hint">API Key 用于保护交易接口</div>
        </section>

        <section class="card">
          <h2>交易</h2>
          <div class="switch-row">
            <div>
              <span>启用交易</span>
              <div class="hint">需 miniQMT 已登录「独立交易」</div>
            </div>
            <label class="toggle"><input id="trading" type="checkbox" /><i class="slider"></i></label>
          </div>
          <div class="field">
            <label for="qmtPath">miniQMT 路径（userdata_mini）</label>
            <div class="path-row">
              <input id="qmtPath" type="text" placeholder="自动探测或手动选择" />
              <button class="btn btn-secondary" id="browseBtn" type="button">浏览</button>
            </div>
          </div>
          <div class="fields-2">
            <div class="field">
              <label for="stockId">普通账户</label>
              <input id="stockId" type="text" placeholder="可选" />
            </div>
            <div class="field">
              <label for="creditId">信用账户</label>
              <input id="creditId" type="text" placeholder="可选" />
            </div>
          </div>
          <div class="field">
            <label for="defaultAccount">默认账户</label>
            <select id="defaultAccount">
              <option value="stock">普通账户</option>
              <option value="credit">信用账户</option>
            </select>
          </div>
        </section>

        <section class="card">
          <h2>选项</h2>
          <div class="switch-row">
            <span>开机启动</span>
            <label class="toggle"><input id="autostart" type="checkbox" /><i class="slider"></i></label>
          </div>
          <div class="switch-row">
            <div>
              <span>打开后自动启动</span>
              <div class="hint">启动面板时拉起服务</div>
            </div>
            <label class="toggle"><input id="startOnLaunch" type="checkbox" /><i class="slider"></i></label>
          </div>
        </section>
      </div>

      <div class="edit-foot">
        <div class="meta">
          <span>miniQMT<b id="qmtMeta">检测中…</b></span>
          <span>xtquant<b id="xtMeta">检测中…</b></span>
        </div>
        <button class="btn btn-primary" id="doneBtn" type="button">完成</button>
      </div>
    </div>

    <div class="foot">
      <span id="version">v</span>
      <button class="ghost" type="button" id="logsBtn">打开日志</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const $ = (id) => document.getElementById(id);
    let busy = false;
    let lastRunning = false;
    let editing = false;
    let manualEdit = false;

    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 1600);
    }

    function setError(msg) {
      const el = $("error");
      el.textContent = msg || "";
      el.classList.toggle("show", !!msg);
    }

    function formConfig(extra) {
      return Object.assign({
        port: Number($("port").value || 8000),
        api_key: $("apiKey").value,
        trading_enabled: $("trading").checked,
        mini_qmt_path: $("qmtPath").value.trim(),
        stock_account_id: $("stockId").value.trim(),
        credit_account_id: $("creditId").value.trim(),
        default_account: $("defaultAccount").value,
        autostart: $("autostart").checked,
        start_on_launch: $("startOnLaunch").checked,
      }, extra || {});
    }

    function applyConfig(cfg) {
      $("port").value = cfg.port;
      $("apiKey").value = cfg.api_key || "";
      $("trading").checked = !!cfg.trading_enabled;
      $("qmtPath").value = cfg.mini_qmt_path || "";
      $("stockId").value = cfg.stock_account_id || "";
      $("creditId").value = cfg.credit_account_id || "";
      $("defaultAccount").value = cfg.default_account || "stock";
      $("autostart").checked = !!cfg.autostart;
      $("startOnLaunch").checked = !!cfg.start_on_launch;
    }

    function setEditing(on, { manual = false } = {}) {
      editing = !!on;
      if (on) {
        if (manual) manualEdit = true;
      } else {
        manualEdit = false;
      }
      document.body.classList.toggle("editing", editing);
      syncSettingsLabel();
    }

    function syncSettingsLabel() {
      const needs = document.body.classList.contains("needs-setup");
      if (editing) {
        $("settingsBtn").textContent = needs && !manualEdit ? "设置" : "收起";
      } else {
        $("settingsBtn").textContent = "设置";
      }
    }

    function setStatus(state) {
      const el = $("status");
      el.classList.remove("ok", "warn", "bad");
      if (state.healthy) {
        el.classList.add("ok");
        el.innerHTML = '<i class="dot"></i>运行中';
      } else if (state.running) {
        el.classList.add("warn");
        el.innerHTML = '<i class="dot"></i>启动中';
      } else {
        el.innerHTML = '<i class="dot"></i>未启动';
      }
      const btn = $("toggleBtn");
      btn.textContent = state.running ? "停止" : "启动";
      btn.classList.toggle("stop", !!state.running);
      $("restartBtn").disabled = !state.running && !state.healthy;
      lastRunning = !!state.running;
    }

    async function refresh() {
      const res = await fetch("/api/state");
      const s = await res.json();
      $("localUrl").textContent = s.local_url;
      $("version").textContent = "v" + s.version;
      const qmtText = s.qmt.running
        ? "已登录"
        : (s.qmt.found ? "已安装，未登录" : "未找到");
      const xtText = s.xtquant.ok
        ? (s.xtquant.version || "可用")
        : "未就绪";
      $("qmtMeta").textContent = qmtText;
      $("xtMeta").textContent = xtText;
      $("qmtMetaCompact").textContent = qmtText;
      $("xtMetaCompact").textContent = xtText;
      setStatus(s);

      const needs = !!s.needs_setup;
      document.body.classList.toggle("needs-setup", needs);
      if (s.missing_required && s.missing_required.length) {
        $("setupBanner").textContent =
          "请补全必填配置：" + s.missing_required.join("、");
      } else {
        $("setupBanner").textContent = "首次使用：请确认端口与交易相关配置后点击「完成」";
      }
      if (needs && !manualEdit) setEditing(true);
      else if (!needs && !manualEdit && editing) setEditing(false);
      else syncSettingsLabel();

      const tag = document.activeElement && document.activeElement.tagName;
      if (tag !== "INPUT" && tag !== "SELECT" && tag !== "TEXTAREA") {
        applyConfig(s.config);
      }
      syncTradingHints();
      return s;
    }

    function syncTradingHints() {
      const on = $("trading").checked;
      $("stockId").placeholder = on ? "至少填一个账户" : "可选";
      $("creditId").placeholder = on ? "至少填一个账户" : "可选";
      $("qmtPath").placeholder = on ? "启用交易时必填" : "自动探测或手动选择";
    }

    async function saveSilent(extra) {
      await fetch("/api/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(formConfig(extra)),
      });
    }

    async function post(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : "{}",
      });
      const data = await res.json().catch(() => ({ ok: false, error: "请求失败" }));
      if (!res.ok && !data.error) data.error = "请求失败";
      return data;
    }

    async function withBusy(fn) {
      if (busy) return;
      busy = true;
      setError("");
      $("toggleBtn").disabled = true;
      $("restartBtn").disabled = true;
      try {
        await fn();
        await refresh();
      } finally {
        busy = false;
        $("toggleBtn").disabled = false;
      }
    }

    $("toggleBtn").onclick = () => withBusy(async () => {
      if (lastRunning) {
        const r = await post("/api/stop");
        if (!r.ok) setError(r.error || "停止失败");
      } else {
        const r = await post("/api/start", formConfig({ setup_complete: true }));
        if (!r.ok) setError(r.error || r.log || "启动失败");
        else if (r.warning) setError(r.warning);
        else if (!manualEdit) setEditing(false);
      }
    });

    $("restartBtn").onclick = () => withBusy(async () => {
      const r = await post("/api/restart", formConfig({ setup_complete: true }));
      if (!r.ok) setError(r.error || r.log || "重启失败");
      else if (r.warning) setError(r.warning);
    });

    $("settingsBtn").onclick = () => {
      if (editing) {
        if (document.body.classList.contains("needs-setup") && !manualEdit) {
          toast("请先完成必填配置并点击「完成」");
          return;
        }
        setEditing(false);
      } else {
        setEditing(true, { manual: true });
      }
    };

    $("doneBtn").onclick = async () => {
      setError("");
      await saveSilent({ setup_complete: true });
      const s = await refresh();
      if (s.needs_setup) {
        setError(
          "仍有必填项未完成" +
          (s.missing_required && s.missing_required.length
            ? "：" + s.missing_required.join("、")
            : "")
        );
        return;
      }
      setEditing(false);
      toast("配置已保存");
    };

    $("docsBtn").onclick = () => post("/api/open-docs");
    $("logsBtn").onclick = () => post("/api/open-logs");
    $("copyBtn").onclick = async () => {
      try {
        await navigator.clipboard.writeText($("localUrl").textContent);
        toast("已复制本机地址");
      } catch {
        toast("复制失败，请手动选择");
      }
    };
    $("browseBtn").onclick = async () => {
      const r = await post("/api/browse");
      if (r.path) {
        $("qmtPath").value = r.path;
        await saveSilent();
      }
    };

    ["port","apiKey","qmtPath","stockId","creditId","defaultAccount"].forEach((id) => {
      $(id).addEventListener("change", () => saveSilent());
    });
    ["trading","autostart","startOnLaunch"].forEach((id) => {
      $(id).addEventListener("change", () => {
        if (id === "trading") syncTradingHints();
        saveSilent();
      });
    });

    refresh().catch((err) => { setError(String(err)); });
    setInterval(() => { if (!busy) refresh().catch(() => {}); }, 2000);
  </script>
</body>
</html>
